<!DOCTYPE html>
<html>
<head>
    <title>Meu Projeto</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>


    <h1 id="titulo">Versão teste para o versionamento</h1>


    <button onclick="mudarTexto()">Clique aqui</button>

    <button onclick="mudarCor()">Mudar cor</button>

    <script>
        function mudarTexto() {
            document.getElementById("titulo").innerText = "Texto alterado ";
        }

        function mudarCor() {
            document.body.style.backgroundColor = "lightblue";
        }
    </script>

</body>
</html>
